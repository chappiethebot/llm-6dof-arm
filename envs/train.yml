# train: ft/ (SFT data prep, LoRA and DistilBERT training). Created 22 Aug 2026, the day the LoRA adapters were trained; its peft 0.20.0 is what ft/runs/*/checkpoint-87 records. Whether other packages changed since then is not recorded. CPU torch build.
# Exported 2026-11-08 from the live env with `pip list --format=freeze` (every package except
# Python itself was installed with pip). Create with:
#   conda env create -n train -f envs/train.yml
