# thesis3meter: thesis3 parent process: telemetry sampler, analyze.py, verify_campaign.py. Loads no model.
# Exported 2026-11-08 from the live env with `pip list --format=freeze` (every package except
# Python itself was installed with pip). Create with:
#   conda env create -n thesis3meter -f envs/thesis3meter.yml
name: thesis3meter
channels:
  - defaults
dependencies:
  - python=3.11.17
  - pip
  - pip:
    - contourpy==1.3.3
    - cycler==0.12.1
    - fonttools==4.66.1
    - kiwisolver==1.5.1
    - matplotlib==3.11.2
    - numpy==2.4.6
    - nvidia-ml-py==13.615.71
    - packaging==26.3
    - pandas==3.0.6
    - pillow==12.3.0
    - psutil==7.2.2
    - pyparsing==3.3.3
    - python-dateutil==2.9.0.post0
    - six==1.17.0
    - tzdata==2026.5
